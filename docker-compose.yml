services:
  postgres:
    image: postgres:16-alpine
    container_name: metadata-etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metadata_etl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metadata_etl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
